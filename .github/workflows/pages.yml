name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # tot de Apps Script-koppeling er is, leest het dashboard data/scores.csv
      - run: mkdir -p site/data && cp data/scores.csv site/data/
      # versienummer achter CSS/JS, zodat browsers na een deploy niet een oude app.js uit hun cache halen
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html site/spel.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
