<title>Tour de LinkedIn Statistieken</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: tv-uitzending van een grote ronde, één smalle kolom zoals het dashboard; het vermogen (watt) is de rode draad. */
:root{
  --geel:#FFD300; --geel-d:#4A3A00; --geel-zacht:rgba(255,211,0,.16);
  --asfalt:#F2F3F5; --inkt:#14161A; --pagina:#14161A; --wit:#1E2127; --wit-2:#262A31; --lijn:#2E333B; --sub:#A3A9B3;
  --blauw:#5AA2F0; --oranje:#F08A3C; --rood:#F0525A;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif; --tekst:Barlow,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pagina);color:var(--asfalt);font:16px/1.5 var(--tekst)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blauw);outline-offset:2px}
.omroep{background:var(--inkt);border-bottom:3px solid var(--geel)}
.omroep-in,.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.omroep-in{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:14px}
.merk{font:900 italic 30px/1 var(--cond);margin:0;text-transform:uppercase}
.merk em{color:var(--geel);font-style:inherit}
.mock{font:700 14px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--inkt);background:var(--geel);padding:5px 9px;border-radius:2px;transform:skewX(-10deg)}
.wrap{padding-block:16px 64px}
.hoofdtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hoofdtabs button{font:800 italic 20px/1 var(--cond);text-transform:uppercase;padding:9px 16px;border-radius:3px;border:1.5px solid var(--lijn);background:var(--wit);cursor:pointer}
.hoofdtabs button[aria-selected="true"]{background:var(--geel);border-color:var(--geel);color:var(--inkt)}
.hoofdtabs button:hover{border-color:var(--geel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.tabs button{border:1.5px solid var(--asfalt);background:var(--wit);border-radius:20px;padding:4px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--geel);border-color:var(--geel);color:var(--inkt)}
.tabs button:hover{border-color:var(--geel)}
.tabs .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.uitleg{background:var(--wit-2);border-left:4px solid var(--geel);padding:10px 14px;font-size:14px;color:var(--asfalt);margin:0 0 4px;border-radius:0 4px 4px 0}
.uitleg b{color:var(--geel)}
section{background:var(--wit);border:1px solid var(--lijn);border-radius:6px;padding:18px 18px 12px;margin-top:16px;min-width:0}
section h2{font:800 italic 27px/1.05 var(--cond);margin:0 0 6px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
section h2::before{content:"";display:inline-block;width:9px;height:.72em;background:var(--geel);margin-right:9px;transform:skewX(-14deg)}
.toel{color:var(--sub);font-size:14px;margin:0 0 10px;max-width:66ch}
.conclusie{font-size:15px;margin:8px 0 6px;max-width:64ch}
.conclusie b{color:var(--geel);font-weight:600}
.scroll{overflow-x:auto;margin-bottom:8px}
.num{font-variant-numeric:tabular-nums}

/* vermogensmeter */
.hero{background:var(--geel);color:var(--inkt);border-radius:3px;overflow:hidden;margin-top:12px}
.finish{height:12px;background:repeating-conic-gradient(var(--inkt) 0 25%,#F2F3F5 0 50%) 0 0/12px 12px}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:6px 18px;padding:16px 20px 18px;align-items:center}
.hero .eyebrow{font:700 15px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--geel-d)}
.hero .naam{font:900 italic clamp(44px,10vw,76px)/.9 var(--cond);text-transform:uppercase;margin:6px 0 4px}
.hero .watt{font:800 clamp(40px,9vw,60px)/1 var(--cond);font-variant-numeric:tabular-nums}
.hero .watt small{font-size:.5em;margin-left:3px}
.hero .delta{font-weight:600;font-size:15px;margin:4px 0 0}
.hero .delta b{font-weight:700}
.hero .rang{font-size:14px;margin:2px 0 0;color:var(--geel-d)}
.meter{width:100%;height:auto;display:block}
.uitleg-knop{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:none;border:1.5px solid var(--inkt);color:var(--inkt);border-radius:20px;padding:3px 12px 3px 4px;font:600 14px/1.4 var(--tekst);cursor:pointer}
.uitleg-knop:hover{background:rgba(20,22,26,.1)}
.uitleg-knop .i{width:20px;height:20px;border-radius:50%;background:var(--inkt);color:var(--geel);display:inline-flex;align-items:center;justify-content:center;font:800 italic 14px/1 var(--cond)}
.watt-uitleg{background:var(--inkt);color:var(--asfalt);margin:0 20px 18px;padding:14px 16px;border-radius:4px;font-size:14px}
.watt-uitleg h3{font:800 italic 20px/1.1 var(--cond);text-transform:uppercase;color:var(--geel);margin:0 0 8px}
.watt-uitleg ul{margin:0;padding-left:18px;display:grid;gap:5px}
.watt-uitleg b{color:var(--geel);font-weight:600}
.watt-uitleg .vb{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--lijn);color:var(--sub)}
.watt-uitleg .vb b{color:var(--asfalt)}
.spellen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.spelkaart{background:var(--wit);border:1px solid var(--lijn);border-radius:4px;padding:10px 10px 6px;min-width:0;cursor:pointer;text-align:left}
.spelkaart:hover,.spelkaart[aria-pressed="true"]{border-color:var(--geel)}
.spelkaart .sk-kop{display:flex;align-items:center;gap:5px;font:700 16px/1 var(--cond);text-transform:uppercase}
.spelkaart .sk-w{font:800 26px/1.1 var(--cond);font-variant-numeric:tabular-nums;margin-top:6px}
.spelkaart .sk-w small{font-size:14px;color:var(--sub);margin-left:2px}
.spelkaart .sk-d{font-size:12px;color:var(--sub);white-space:nowrap}
.spelkaart svg.spark{display:block;width:100%;height:30px;margin-top:4px}
.op{color:var(--blauw)} .neer{color:var(--oranje)}

/* grafiek */
.grafiek{position:relative}
.grafiek svg{display:block;touch-action:pan-y}
.as text,.grafiek text{font-family:var(--tekst);font-size:12px;fill:var(--sub)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:8px 0 2px;color:var(--sub)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:50%}
.legenda i.lijn{width:18px;height:3px;border-radius:2px}
.legenda i.ring{background:transparent;border:2px solid var(--rood)}
.tip{position:fixed;z-index:20;pointer-events:none;background:#0B0C0E;border:1px solid var(--lijn);border-radius:4px;padding:8px 10px;font-size:13px;line-height:1.4;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.tip b{font-weight:600;color:var(--asfalt)}
.tip .t-k{font:700 15px/1.1 var(--cond);text-transform:uppercase;color:var(--geel);display:block;margin-bottom:2px}
.tip .t-s{color:var(--sub)}

/* tabellen */
.tbl{width:100%;min-width:480px;border-collapse:separate;border-spacing:3px;table-layout:fixed;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font:700 15px/1.1 var(--cond);padding:4px 2px;text-align:center}
.tbl th small{display:block;font:400 11px/1.3 var(--tekst);color:var(--sub)}
.tbl td{padding:7px 2px;text-align:center;border-radius:3px;background:var(--wit-2)}
.tbl td:first-child,.tbl th:first-child{text-align:left;width:76px;font-weight:600;background:none;padding-left:0}
.tbl td .pijl{display:block;font-size:11px;line-height:1.1}
.tbl tr.som td{font-weight:700}
.tbl tr.som td:first-child{color:var(--geel)}
.tbl td.ster{box-shadow:inset 0 0 0 2px var(--geel)}
.tbl td.leeg{color:var(--sub);background:transparent}
.schaal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin:4px 0 6px;flex-wrap:wrap}
.schaal .balk{width:150px;height:10px;border-radius:5px;background:linear-gradient(90deg,color-mix(in srgb,var(--oranje) 55%,var(--wit-2)),var(--wit-2),color-mix(in srgb,var(--blauw) 55%,var(--wit-2)))}
.lijst{list-style:none;margin:0;padding:0}
.lijst li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--lijn);font-size:14px}
.lijst li:first-child{border-top:0}
.lijst .pos{font:700 18px/1 var(--cond);color:var(--sub)}
.lijst .w{font:800 20px/1 var(--cond);font-variant-numeric:tabular-nums;color:var(--geel)}
.lijst .s{color:var(--sub);font-size:13px}
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.tegel{background:var(--wit-2);border-radius:4px;padding:10px 12px}
.tegel b{display:block;font:800 26px/1.05 var(--cond);font-variant-numeric:tabular-nums}
.tegel span{font-size:13px;color:var(--sub)}
.feit{padding:9px 0;border-top:1px solid var(--lijn);font-size:15px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px}
.feit:first-of-type{border-top:0}
.feit .ic{font:800 18px/1.3 var(--cond);color:var(--geel)}
.feit b{font-weight:600}

/* peloton */
.vorm-rij{display:grid;grid-template-columns:22px 40px minmax(0,1fr) 110px 74px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--lijn)}
.vorm-rij:first-of-type{border-top:0}
.vorm-rij .pos{font:700 20px/1 var(--cond);color:var(--sub);text-align:center}
.vorm-rij .nm{font-weight:600;min-width:0}
.vorm-rij .nm small{display:block;color:var(--sub);font-weight:400;font-size:12px}
.vorm-rij .w{font:800 22px/1 var(--cond);text-align:right;font-variant-numeric:tabular-nums}
.vorm-rij .w small{display:block;font:500 12px/1.4 var(--tekst)}
.vorm-rij svg{width:110px;height:28px;display:block}
.bib{position:relative;width:40px;height:30px;border-radius:2px;background:#F2F3F5;color:var(--inkt);display:flex;align-items:center;justify-content:center;font:800 18px/1 var(--cond)}
.bib::before,.bib::after{content:"";position:absolute;top:3px;width:3px;height:3px;border-radius:50%;background:#8A9099}
.bib::before{left:3px}.bib::after{right:3px}
.kal{border-spacing:3px;border-collapse:separate;font-size:11px;font-variant-numeric:tabular-nums;margin:0 auto 0 0}
.kal th{font:700 14px/1 var(--cond);color:var(--sub);padding:2px 0;width:60px}
.kal th.wk{width:44px;text-align:left;font:500 11px/1 var(--tekst)}
.kal td{height:30px;text-align:center;border-radius:3px;color:var(--inkt);font-weight:600}
.kal td.x{background:transparent}
.verhuis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.verhuis div{background:var(--wit-2);border-radius:4px;padding:10px 12px;font-size:14px}
.verhuis div b{display:block;font:700 17px/1.2 var(--cond);text-transform:uppercase}

/* weetje */
.wnav{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.wnav button{width:38px;height:38px;border:1.5px solid var(--asfalt);background:var(--wit);border-radius:4px;cursor:pointer;font-size:20px;line-height:1}
.wnav button:disabled{opacity:.3;cursor:default}
.wnav select{height:38px;border:1.5px solid var(--asfalt);background:var(--wit);border-radius:4px;padding:0 10px;font:700 17px var(--cond);max-width:100%}
.weetje{position:relative;background:var(--inkt);border:1px solid var(--lijn);border-radius:4px;overflow:hidden}
.weetje .w-band{display:flex;align-items:stretch}
.weetje .w-label{background:var(--geel);color:var(--inkt);font:900 italic 18px/1 var(--cond);text-transform:uppercase;padding:9px 18px 8px 16px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);letter-spacing:.03em}
.weetje .w-cat{align-self:center;font:700 14px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--sub);padding:0 12px}
.weetje .w-tekst{font:700 clamp(24px,5.4vw,36px)/1.1 var(--cond);margin:14px 18px 10px;text-wrap:balance}
.weetje .w-tekst b{color:var(--geel);font-weight:800}
.weetje .w-zeld{display:flex;gap:8px;flex-wrap:wrap;margin:0 18px 16px}
.pill{font:700 14px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:20px;border:1.5px solid var(--geel);color:var(--geel)}
.pill.vol{background:var(--geel);color:var(--inkt)}
.zeldmeter{display:flex;gap:2px;align-items:flex-end;height:18px}
.zeldmeter i{width:5px;background:var(--lijn);border-radius:1px}
.zeldmeter i.aan{background:var(--geel)}
.ook{margin-top:12px}
.ook h3{font:700 16px/1 var(--cond);text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin:0 0 4px}
.cat-tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:440px}
.cat-tbl th{font:700 14px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.04em;color:var(--sub);text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--lijn)}
.cat-tbl td{padding:7px 6px 7px 0;border-bottom:1px solid var(--lijn);vertical-align:top}
.cat-tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat-tbl .groep{font:700 12px/1 var(--cond);text-transform:uppercase;letter-spacing:.05em;color:var(--geel)}
.cat-tbl tr.nooit td{color:var(--sub)}
.huld{display:grid;grid-template-columns:minmax(0,1fr);gap:0;background:#0B0C0E;border-radius:4px;overflow:hidden;margin-top:8px}
.huld .h-baan{height:64px;background:linear-gradient(180deg,#1B1E23,#101215);position:relative}
.huld .h-baan::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-conic-gradient(var(--inkt) 0 25%,#F2F3F5 0 50%) 0 0/8px 8px}
.huld .h-in{padding:12px 16px 14px}
.huld .h-k{font:700 13px/1 var(--cond);text-transform:uppercase;letter-spacing:.06em;color:var(--geel);margin:0 0 6px}
.huld p{margin:0;font:700 20px/1.2 var(--cond)}

footer{color:var(--sub);font-size:13px;margin-top:22px;max-width:66ch}
@media (max-width:620px){
  .hero-in{grid-template-columns:1fr}
  .meter{max-width:280px}
  .spellen{grid-template-columns:repeat(3,minmax(0,1fr))}
  .vorm-rij{grid-template-columns:22px 40px minmax(0,1fr) 64px}
  .vorm-rij svg{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .teken{stroke-dasharray:1;stroke-dashoffset:1;animation:teken 1.1s ease-out .1s forwards}
  @keyframes teken{to{stroke-dashoffset:0}}
}
</style>

<header class="omroep"><div class="omroep-in"><p class="merk">Tour de <em>LinkedIn</em></p><span class="mock" id="mockLabel">Mock-up</span></div></header>
<div class="wrap">
  <nav class="hoofdtabs" role="tablist" aria-label="Onderdeel">
    <button role="tab" data-tab="ik" aria-selected="true">Ik</button>
    <button role="tab" data-tab="peloton" aria-selected="false">Peloton</button>
    <button role="tab" data-tab="weetje" aria-selected="false">Weetje van de dag</button>
  </nav>

  <div id="v-ik">
    <div class="tabs" id="spelerKeus" role="group" aria-label="Kies renner"></div>
    <div class="hero" id="hero"></div>
    <div class="spellen" id="spelKaarten"></div>
    <section id="s-verloop"></section>
    <section id="s-week"></section>
    <section id="s-toen"></section>
    <section id="s-records"></section>
    <section id="s-reeksen"></section>
    <section id="s-opvallend"></section>
  </div>

  <div id="v-peloton" hidden>
    <section id="p-vorm"></section>
    <section id="p-kal"></section>
    <section id="p-verhuis"></section>
  </div>

  <div id="v-weetje" hidden>
    <p class="uitleg">Dit komt op de <b>Tour-pagina</b> naast de uitslag van de dag, en als laatste scène van de huldiging. Blader door de etappes om te zien wat er elke dag uit was gekomen.</p>
    <section id="w-dag"></section>
    <section id="w-cat"></section>
  </div>

  <footer id="voet"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script type="text/plain" id="scores">/*__CSV__*/</script>
<script>
(() => {
/* ===== instellingen, gelijk aan het dashboard ===== */
const STRAF = 10, BASIS = 300, VENSTER = 14, SKILL_VENSTER = 21;
const SP_ORDER = ["Wend","Patches","Zip","Tango","Queens"], PL_ORDER = ["Matta","Bouw","Corne","Jari","Giyo","Cas"];
const SPELER_KLEUR = ["#3987e5","#d95926","#199e70","#c98500","#d55181","#9085e9","#e66767","#4fa83d"];
const TRUI = { Wend:["#2563C9","#0F2E5C"], Zip:["#1E8A4C","#0E3F22"], Patches:["#F07A1A","#6A300A"], Tango:["#FFFFFF","#6B7078"], Queens:["#FFFFFF","#8E1B28"] };
const SHIRT = "M10 4 L13 3 Q16 7 19 3 L22 4 L30 10 L26 15 L23 13 L23 29 L9 29 L9 13 L6 15 L2 10 Z";
/* weekdag: één oplopende reeks van lichtgeel (maandag, makkelijk) naar oranjerood (zondag, zwaar) */
const WD_KLEUR = ["#FFF1A8","#FFE066","#FFCC33","#FFB020","#F9922B","#EE7034","#DE4F3F"];
const DAGEN = ["Ma","Di","Wo","Do","Vr","Za","Zo"], DAGEN_LANG = ["maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag","zondag"];
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MAANDEN_LANG = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const ETAPPE = "Etappe";

/* ===== hulpjes ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = sec => { sec = Math.round(sec); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`; };
const duur = sec => { const u = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return u ? `${u} uur ${m} min` : `${m} min`; };
const wdOf = ds => (new Date(ds + "T12:00:00").getDay() + 6) % 7;
const datumKort = ds => { const d = new Date(ds + "T12:00:00"); return `${DAGEN[wdOf(ds)].toLowerCase()} ${d.getDate()} ${MAANDEN[d.getMonth()]}`; };
const datumNL = ds => { const d = new Date(ds + "T12:00:00"); return `${DAGEN_LANG[wdOf(ds)]} ${d.getDate()} ${MAANDEN_LANG[d.getMonth()]}`; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const median = a => { if(!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const quant = (a, q) => { const s = a.slice().sort((x, y) => x - y), i = (s.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return s[lo] + (s[hi] - s[lo]) * (i - lo); };
const sd = a => { const m = mean(a); return a.length > 1 ? Math.sqrt(a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1)) : 0; };
const watt = r => BASIS * Math.exp(-r);
const namen = a => a.length === 1 ? a[0] : a.slice(0, -1).join(", ") + " en " + a[a.length - 1];
const pctTxt = f => `${Math.round(Math.abs(f) * 100)}%`;
const trui = (g, size = 18) => { const [f, s] = TRUI[g] || ["#9085e9","#2E1C5E"]; const dots = g === "Queens" ? [[12,10],[20,10],[16,17],[12,23],[20,23]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.3" fill="#D7263D"/>`).join("") : ""; return `<svg viewBox="0 0 32 32" width="${size}" height="${size}" aria-hidden="true"><path d="${SHIRT}" fill="${f}" stroke="${s}" stroke-width="1.3" stroke-linejoin="round"/>${dots}</svg>`; };
const opslaan = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const lezen = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };

/* ===== data laden (lang formaat, zoals data/scores.csv) ===== */
const uniek = new Map();
$("#scores").textContent.trim().split(/\r?\n/).slice(1).forEach(l => {
  const [datum, speler, spel, tijd] = l.split(",");
  const t = Number(tijd);
  if(!datum || !speler || !spel || !(t > 0)) return;
  uniek.set(`${datum}|${speler}|${spel}`, { datum, speler, spel, t });
});
const rijen = [...uniek.values()];
const dates = [...new Set(rijen.map(r => r.datum))].sort();
const D = dates.length, dIdx = new Map(dates.map((d, i) => [d, i]));
const num = dates.map(ds => Math.round(Date.parse(ds + "T12:00:00Z") / 864e5));
const wd = dates.map(wdOf);
const volgorde = (voorkeur, gezien) => [...voorkeur.filter(x => gezien.includes(x)), ...gezien.filter(x => !voorkeur.includes(x))];
const games = volgorde(SP_ORDER, [...new Set(rijen.map(r => r.spel))]);
const eerste = {};
rijen.slice().sort((a, b) => a.datum.localeCompare(b.datum)).forEach(r => { if(!eerste[r.speler]) eerste[r.speler] = r.datum; });
const players = volgorde(PL_ORDER, Object.keys(eerste).sort((a, b) => eerste[a].localeCompare(eerste[b])));
const kleurVan = p => SPELER_KLEUR[players.indexOf(p) % SPELER_KLEUR.length];
const bib = p => `<span class="bib">${players.indexOf(p) + 1}</span>`;
const raw = {}; games.forEach(g => raw[g] = dates.map(() => null));
rijen.forEach(r => { const d = dIdx.get(r.datum); (raw[r.spel][d] ||= {})[r.speler] = r.t; });
const meeOp = d => players.filter(p => eerste[p] <= dates[d]);
/* gemist spel: langzaamste tijd van die dag + 10 s, zoals de Tour-regel */
const eff = (g, d, p) => { const v = raw[g][d]; return v[p] ?? Math.max(...Object.values(v)) + STRAF; };

/* ===== etappes ===== */
function rangschik(t, wie){
  const a = wie.map(p => ({ p, t:t[p] })).sort((x, y) => x.t - y.t || players.indexOf(x.p) - players.indexOf(y.p));
  let pos = 0; a.forEach((r, i) => { if(i === 0 || r.t !== a[i - 1].t) pos = i + 1; r.pos = pos; }); return a;
}
const E = dates.map((ds, d) => {
  const gs = games.filter(g => raw[g][d]), m = meeOp(d);
  const tot = {}, full = {}, gw = {}, spelWinnaars = {};
  m.forEach(p => { tot[p] = gs.reduce((a, g) => a + eff(g, d, p), 0); gw[p] = 0; if(gs.every(g => raw[g][d][p] != null)) full[p] = gs.reduce((a, g) => a + raw[g][d][p], 0); });
  gs.forEach(g => { const v = raw[g][d], b = Math.min(...Object.values(v)); spelWinnaars[g] = Object.keys(v).filter(p => v[p] === b); spelWinnaars[g].forEach(p => { if(p in gw) gw[p]++; }); });
  const rang = rangschik(tot, m);
  return { d, ds, gs, m, tot, full, gw, spelWinnaars, rang, winnaars:rang.filter(r => r.pos === 1).map(r => r.p), mk:ds.slice(0, 7), straf:m.filter(p => gs.some(g => raw[g][d][p] == null)) };
});
/* gele trui per dag (maandklassement), voor de weetjes */
E.forEach((e, d) => {
  const tour = E.filter(x => x.mk === e.mk && x.d <= d), wie = players.filter(p => eerste[p] <= tour[0].ds);
  const som = {}; wie.forEach(p => som[p] = tour.reduce((a, x) => a + (x.tot[p] ?? 0), 0));
  e.gc = rangschik(som, wie); e.tourNr = tour.length;
});

/* ===== het model: tegen de puzzel =====
   Per spel en dag: log(tijd) = niveau van de renner (glijdend, ±21 dagen) + zwaarte van de puzzel.
   De zwaarte voor renner p wordt geschat uit de ANDERE renners, zodat je jezelf niet meet.
   Vermogen = 300 W × verwachte tijd van een gemiddelde renner / jouw tijd. */
const M = {};
games.forEach(g => {
  const R = raw[g], S = {}, diff = new Array(D).fill(null);
  players.forEach(p => S[p] = new Array(D).fill(0));
  const zwaarte = () => { for(let d = 0; d < D; d++) diff[d] = R[d] ? mean(Object.entries(R[d]).map(([q, t]) => Math.log(t) - S[q][d])) : null; };
  for(let it = 0; it < 8; it++){
    zwaarte();
    players.forEach(q => {
      const eigen = []; for(let d = 0; d < D; d++) if(R[d] && R[d][q] != null) eigen.push(d);
      if(!eigen.length) return;
      const res = eigen.map(d => Math.log(R[d][q]) - diff[d]), alles = mean(res);
      for(let d = 0; d < D; d++){
        const v = []; eigen.forEach((j, k) => { if(j !== d && Math.abs(num[j] - num[d]) <= SKILL_VENSTER) v.push(res[k]); });
        S[q][d] = v.length >= 3 ? mean(v) : alles;
      }
    });
    const alle = []; players.forEach(q => { for(let d = 0; d < D; d++) if(R[d] && R[d][q] != null) alle.push(S[q][d]); });
    const c = mean(alle); players.forEach(q => { for(let d = 0; d < D; d++) S[q][d] -= c; });
  }
  zwaarte();
  const wdNorm = DAGEN.map((_, w) => mean(diff.filter((x, d) => x != null && wd[d] === w)));
  const score = {}; players.forEach(p => score[p] = new Array(D).fill(null));
  for(let d = 0; d < D; d++){
    if(!R[d]) continue;
    const mx = Math.max(...Object.values(R[d]));
    meeOp(d).forEach(p => {
      const ander = Object.entries(R[d]).filter(([q]) => q !== p);
      const dex = ander.length >= 2 ? mean(ander.map(([q, t]) => Math.log(t) - S[q][d])) : wdNorm[wd[d]];
      const straf = R[d][p] == null, t = straf ? mx + STRAF : R[d][p], r = Math.log(t) - dex;
      score[p][d] = { r, t, straf, norm:Math.exp(dex), watt:watt(r), g };
    });
  }
  M[g] = { diff, wdNorm, score };
});
const comb = {};
players.forEach(p => comb[p] = dates.map((_, d) => {
  const s = E[d].gs.map(g => M[g].score[p][d]).filter(Boolean);
  if(!s.length) return null;
  const r = mean(s.map(x => x.r));
  return { r, t:s.reduce((a, x) => a + x.t, 0), norm:s.reduce((a, x) => a + x.norm, 0), straf:s.some(x => x.straf), watt:watt(r), g:ETAPPE };
}));
const serie = (p, g) => g === ETAPPE ? comb[p] : M[g].score[p];
function vorm(p, g, eind = D - 1, len = VENSTER){
  const s = serie(p, g), v = [];
  for(let d = 0; d <= eind; d++) if(s[d] && num[d] > num[eind] - len) v.push(s[d].r);
  if(!v.length) return null;
  const r = mean(v); return { r, watt:watt(r), n:v.length, se:v.length > 1 ? sd(v) / Math.sqrt(v.length) : 0 };
}
const idxVoor = n => { let i = -1; for(let d = 0; d < D; d++) if(num[d] <= n) i = d; return i; };
const vorigEind = idxVoor(num[D - 1] - VENSTER);
const glijdend = (p, g) => dates.map((_, d) => { const s = serie(p, g); if(!s[d]) return null; const v = vorm(p, g, d); return v && v.n >= 3 ? v : null; });

/* ===== status ===== */
let tab = ["ik","peloton","weetje"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "ik";
let speler = players.includes(lezen("tdl-stat-speler")) ? lezen("tdl-stat-speler") : players[players.length - 2] || players[0];
let wattOpen = false, spelKeus = ETAPPE, modus = "puzzel", kalSpel = "Queens", wDag = D - 1;
$("#mockLabel").textContent = `Mock-up · echte data t/m ${datumKort(dates[D - 1])}`;

/* ===== tooltip ===== */
const tip = $("#tip");
function toonTip(html, x, y){
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let lx = x + 14, ly = y + 14;
  if(lx + w > innerWidth - 8) lx = x - w - 14;
  if(ly + h > innerHeight - 8) ly = y - h - 14;
  tip.style.left = Math.max(8, lx) + "px"; tip.style.top = Math.max(8, ly) + "px";
}
const verbergTip = () => tip.hidden = true;
document.addEventListener("pointerover", ev => { const el = ev.target.closest("[data-tip]"); if(el) toonTip(el.dataset.tip, ev.clientX, ev.clientY); });
document.addEventListener("pointermove", ev => { const el = ev.target.closest("[data-tip]"); if(el) toonTip(el.dataset.tip, ev.clientX, ev.clientY); });
document.addEventListener("pointerout", ev => { if(ev.target.closest("[data-tip]")) verbergTip(); });
addEventListener("scroll", verbergTip, { passive:true });

/* ===== kleine grafiekjes ===== */
function spark(vals, w = 100, h = 30, kleur = "var(--geel)", ref = BASIS){
  const pts = vals.map((v, i) => v == null ? null : [i, v]).filter(Boolean);
  if(pts.length < 2) return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"></svg>`;
  const lv = pts.map(p => Math.log(p[1])).concat([Math.log(ref)]);
  const lo = Math.min(...lv), hi = Math.max(...lv), n = vals.length - 1;
  const X = i => 2 + (w - 6) * i / n, Y = v => h - 3 - (h - 6) * (Math.log(v) - lo) / ((hi - lo) || 1);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
  const laatst = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="0" x2="${w}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="#3A404A" stroke-dasharray="2 3"/>
    <path d="${d} L${X(laatst[0])} ${h} L${X(pts[0][0])} ${h} Z" fill="${kleur}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${kleur}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${X(laatst[0])}" cy="${Y(laatst[1])}" r="2.6" fill="${kleur}"/></svg>`;
}
/* vermogensmeter: halve cirkel, 150–600 W op logschaal, 300 W precies bovenin */
function meter(w){
  const lo = Math.log(150), hi = Math.log(600), cx = 130, cy = 120, R = 98;
  const hoek = v => Math.PI * (1 - (Math.log(Math.min(600, Math.max(150, v))) - lo) / (hi - lo));
  const pt = (a, r = R) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
  const boog = (a0, a1, r = R) => { const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 ${a0 > a1 ? 1 : 0} ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
  const a = hoek(w), a3 = hoek(300);
  const ticks = [150,200,300,450,600].map(v => { const t = hoek(v), [x0, y0] = pt(t, R + 10), [x1, y1] = pt(t, R + 20); const [tx, ty] = pt(t, R + 31); return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#14161A" stroke-width="2"/><text x="${tx}" y="${ty + 4}" text-anchor="middle" font-size="12" font-weight="600" fill="#4A3A00" font-family="Barlow,sans-serif">${v}</text>`; }).join("");
  const [nx, ny] = pt(a, R - 16);
  return `<svg class="meter" viewBox="-22 -14 304 150" role="img" aria-label="Vermogensmeter: ${Math.round(w)} watt">
    <path d="${boog(Math.PI, 0)}" fill="none" stroke="rgba(20,22,26,.16)" stroke-width="18"/>
    <path class="teken" pathLength="1" d="${boog(a3, a)}" fill="none" stroke="#14161A" stroke-width="18"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#D7263D" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="8" fill="#14161A"/>
    <text x="${cx}" y="${cy - 30}" text-anchor="middle" font-size="12" fill="#4A3A00" font-family="Barlow,sans-serif">watt</text></svg>`;
}

/* ===== IK ===== */
function renderSpelerKeus(){
  $("#spelerKeus").innerHTML = players.map(p => `<button data-sp="${esc(p)}" aria-pressed="${p === speler}"><span class="sw" style="background:${kleurVan(p)}"></span>${esc(p)}</button>`).join("");
  $("#spelerKeus").querySelectorAll("button").forEach(b => b.onclick = () => { speler = b.dataset.sp; opslaan("tdl-stat-speler", speler); renderIk(); $(`#spelerKeus [data-sp="${CSS.escape(speler)}"]`).focus(); });
}
const deltaTxt = (nu, toen) => {
  if(!nu || !toen) return `<span class="t-s">nog geen vergelijking</span>`;
  const f = nu.watt / toen.watt - 1;
  if(Math.abs(f) < .02) return `<span>= gelijk</span>`;
  return f > 0 ? `<span class="op">▲ ${pctTxt(f)}</span>` : `<span class="neer">▼ ${pctTxt(f)}</span>`;
};
function renderHero(){
  const p = speler, nu = vorm(p, ETAPPE), toen = vorigEind >= 0 ? vorm(p, ETAPPE, vorigEind) : null;
  const rang = players.map(q => ({ q, v:vorm(q, ETAPPE) })).filter(x => x.v && x.v.n >= 5).sort((a, b) => b.v.watt - a.v.watt);
  const plek = rang.findIndex(x => x.q === p);
  let deltaZin = "Nog te weinig etappes om te vergelijken.";
  if(nu && toen){
    const f = nu.watt / toen.watt - 1;
    deltaZin = Math.abs(f) < .02 ? "Even sterk als de 14 dagen ervoor." : `<b>${f > 0 ? "▲" : "▼"} ${pctTxt(f)}</b> ${f > 0 ? "sterker" : "zwakker"} dan de 14 dagen ervoor (${Math.round(toen.watt)} W).`;
  }
  const tijdF = nu ? 1 - BASIS / nu.watt : 0;
  $("#hero").innerHTML = `<div class="finish"></div><div class="hero-in">
    <div>
      <p class="eyebrow">Vorm van de laatste 14 dagen</p>
      <p class="naam">${esc(p)}</p>
      <div class="watt">${nu ? Math.round(nu.watt) : "–"}<small>W</small></div>
      <p class="delta">${deltaZin}</p>
      <button type="button" class="uitleg-knop" id="wattKnop" aria-expanded="${wattOpen}" aria-controls="wattUitleg"><span class="i" aria-hidden="true">i</span>Wat betekent watt?</button>
      <p class="rang">${nu ? `${tijdF >= 0 ? `${pctTxt(tijdF)} minder tijd nodig` : `${pctTxt(tijdF)} meer tijd nodig`} dan een gemiddelde renner op dezelfde puzzels. ` : ""}${plek >= 0 ? `Nummer ${plek + 1} van ${rang.length} in vorm.` : ""}</p>
    </div>
    <div>${nu ? meter(nu.watt) : ""}</div></div>
    <div class="watt-uitleg" id="wattUitleg" ${wattOpen ? "" : "hidden"}>
      <h3>Wat betekent watt?</h3>
      <ul>
        <li><b>300 W</b> is wat een gemiddelde renner uit de groep op <i>dezelfde puzzel</i> zou trappen. Daarboven ben je sneller, daaronder trager.</li>
        <li>Zo tellen makkelijke maandagen en zware zondagen eerlijk mee: je wordt altijd gemeten tegen hoe zwaar die puzzel was.</li>
        <li>Hoe zwaar een puzzel was, halen we uit de tijden van de <i>anderen</i> die dag, rekening houdend met hun eigen niveau. Jouw tijd telt niet mee in je eigen maatstaf.</li>
        <li>Rekensom: 300 × verwachte tijd ÷ jouw tijd. 360 W = 17% minder tijd nodig, 240 W = 25% meer tijd nodig.</li>
        <li>Spel gemist? Dan telt de straftijd (langzaamste tijd van die dag + 10 s). Er zijn is ook een kwaliteit.</li>
        <li>Je <b>vorm</b> is je gemiddelde over de laatste 14 dagen.</li>
      </ul>
      <p class="vb">Voorbeeld: een gemiddelde renner doet de zondag-Queens in <b>1:30</b>, jij in <b>1:15</b>. Dan trap je 300 × 90 ÷ 75 = <b>360 W</b>. Geen echte watt, wel een eerlijke vergelijking.</p>
    </div>`;
  $("#wattKnop").onclick = () => { wattOpen = !wattOpen; $("#wattKnop").setAttribute("aria-expanded", wattOpen); $("#wattUitleg").hidden = !wattOpen; };
  $("#spelKaarten").innerHTML = games.map(g => {
    const v = vorm(p, g), t = vorigEind >= 0 ? vorm(p, g, vorigEind) : null;
    const lijn = glijdend(p, g).map(x => x && x.watt);
    return `<button class="spelkaart" data-g="${esc(g)}" aria-pressed="${spelKeus === g}" title="Toon ${esc(g)} in de grafiek">
      <div class="sk-kop">${trui(g)}${esc(g)}</div>
      <div class="sk-w">${v ? Math.round(v.watt) : "–"}<small>W</small></div>
      <div class="sk-d">${deltaTxt(v, t)}</div>${spark(lijn)}</button>`;
  }).join("");
  $("#spelKaarten").querySelectorAll(".spelkaart").forEach(b => b.onclick = () => { spelKeus = spelKeus === b.dataset.g ? ETAPPE : b.dataset.g; renderHero(); renderVerloop(); $("#s-verloop").scrollIntoView({ behavior:"smooth", block:"start" }); });
}

function renderVerloop(){
  const p = speler, g = spelKeus, s = serie(p, g);
  const box = $("#s-verloop");
  box.innerHTML = `<h2>Verloop</h2>
    <p class="toel">${modus === "puzzel" ? "Elke stip is één dag, gemeten tegen de puzzel van die dag. De gele lijn is je vorm: het gemiddelde over 14 dagen, met de band als onzekerheid. Boven de stippellijn ben je sneller dan een gemiddelde renner." : "Dezelfde dagen in echte seconden. De grijze lijn is wat een gemiddelde renner op die puzzel nodig had. Zie hoe de weekdag alles bepaalt."}</p>
    <div class="tabs" id="vSpel" role="group" aria-label="Kies spel">${[ETAPPE, ...games].map(x => `<button data-g="${esc(x)}" aria-pressed="${x === g}">${x === ETAPPE ? "Hele etappe" : trui(x, 16) + esc(x)}</button>`).join("")}</div>
    <div class="tabs" id="vModus" role="group" aria-label="Weergave"><button data-m="puzzel" aria-pressed="${modus === "puzzel"}">Tegen de puzzel (watt)</button><button data-m="ruw" aria-pressed="${modus === "ruw"}">Ruwe tijden</button></div>
    <div class="grafiek" id="vGraf"></div>
    <div class="legenda">${DAGEN.map((d, i) => `<span><i style="background:${WD_KLEUR[i]}"></i>${d}</span>`).join("")}<span><i class="ring"></i>straftijd</span>${modus === "puzzel" ? `<span><i class="lijn" style="background:var(--geel)"></i>vorm (14 d)</span>` : `<span><i class="lijn" style="background:#8A9099"></i>gemiddelde renner</span>`}</div>
    <p class="conclusie" id="vConc"></p>`;
  box.querySelectorAll("#vSpel button").forEach(b => b.onclick = () => { spelKeus = b.dataset.g; renderHero(); renderVerloop(); });
  box.querySelectorAll("#vModus button").forEach(b => b.onclick = () => { modus = b.dataset.m; renderVerloop(); });

  const W = Math.max(300, Math.round($("#vGraf").clientWidth)), H = 270, L = 46, Rm = 10, T = 12, B = 28;
  const d0 = dIdx.get(eerste[p]), dagen = []; for(let d = d0; d < D; d++) if(s[d]) dagen.push(d);
  if(dagen.length < 2){ $("#vGraf").innerHTML = `<p class="toel">Nog te weinig dagen.</p>`; return; }
  const xs = d => L + (W - L - Rm) * (num[d] - num[d0]) / ((num[D - 1] - num[d0]) || 1);
  const rol = glijdend(p, g);
  let vals, ticks, fmtY;
  if(modus === "puzzel"){
    vals = dagen.map(d => s[d].watt).concat(dagen.filter(d => rol[d]).flatMap(d => [watt(rol[d].r + rol[d].se), watt(rol[d].r - rol[d].se)]), [BASIS]);
    ticks = [75,100,150,200,300,450,600,900,1200]; fmtY = v => v + " W";
  } else {
    vals = dagen.flatMap(d => [s[d].t, s[d].norm]);
    ticks = [2,5,10,20,30,60,120,180,300,600,900]; fmtY = v => v < 60 ? v + "s" : fmt(v);
  }
  let lo = Math.log(Math.min(...vals)) - .06, hi = Math.log(Math.max(...vals)) + .06;
  const Y = v => T + (H - T - B) * (1 - (Math.log(v) - lo) / (hi - lo));
  const zicht = ticks.filter(v => Math.log(v) >= lo && Math.log(v) <= hi);
  let svg = zicht.map(v => `<line x1="${L}" x2="${W - Rm}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#2A2F36"/><text x="${L - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end">${fmtY(v)}</text>`).join("");
  /* x-as: de eerste van elke maand */
  for(let d = d0; d < D; d++) if(d === d0 || dates[d].slice(8) === "01" || (d > d0 && dates[d].slice(0, 7) !== dates[d - 1].slice(0, 7))){
    const m = new Date(dates[d] + "T12:00:00"); svg += `<text x="${xs(d).toFixed(1)}" y="${H - 8}" text-anchor="${d === d0 ? "start" : "middle"}">${m.getDate()} ${MAANDEN[m.getMonth()]}</text>`;
  }
  if(modus === "puzzel"){
    svg += `<line x1="${L}" x2="${W - Rm}" y1="${Y(BASIS)}" y2="${Y(BASIS)}" stroke="#8A9099" stroke-dasharray="4 4"/><text x="${W - Rm}" y="${Y(BASIS) - 5}" text-anchor="end">gemiddelde renner</text>`;
    const rd = dagen.filter(d => rol[d]);
    if(rd.length > 1){
      const boven = rd.map(d => `${xs(d).toFixed(1)} ${Y(watt(rol[d].r - rol[d].se)).toFixed(1)}`), onder = rd.slice().reverse().map(d => `${xs(d).toFixed(1)} ${Y(watt(rol[d].r + rol[d].se)).toFixed(1)}`);
      svg += `<path d="M${boven.join(" L")} L${onder.join(" L")} Z" fill="#FFD300" opacity=".14"/>`;
    }
    svg += dagen.map(d => { const v = s[d]; return v.straf ? `<circle cx="${xs(d).toFixed(1)}" cy="${Y(v.watt).toFixed(1)}" r="4.5" fill="#1E2127" stroke="#F0525A" stroke-width="2"/>` : `<circle cx="${xs(d).toFixed(1)}" cy="${Y(v.watt).toFixed(1)}" r="4.5" fill="${WD_KLEUR[wd[d]]}" stroke="#1E2127" stroke-width="1.5"/>`; }).join("");
    if(rd.length > 1) svg += `<path class="teken" pathLength="1" d="${rd.map((d, i) => `${i ? "L" : "M"}${xs(d).toFixed(1)} ${Y(rol[d].watt).toFixed(1)}`).join(" ")}" fill="none" stroke="#FFD300" stroke-width="3" stroke-linejoin="round"/>`;
  } else {
    svg += `<path d="${dagen.map((d, i) => `${i ? "L" : "M"}${xs(d).toFixed(1)} ${Y(s[d].norm).toFixed(1)}`).join(" ")}" fill="none" stroke="#8A9099" stroke-width="2" stroke-linejoin="round"/>`;
    svg += dagen.map(d => { const v = s[d]; return v.straf ? `<circle cx="${xs(d).toFixed(1)}" cy="${Y(v.t).toFixed(1)}" r="4.5" fill="#1E2127" stroke="#F0525A" stroke-width="2"/>` : `<circle cx="${xs(d).toFixed(1)}" cy="${Y(v.t).toFixed(1)}" r="4.5" fill="${WD_KLEUR[wd[d]]}" stroke="#1E2127" stroke-width="1.5"/>`; }).join("");
  }
  $("#vGraf").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Verloop van ${esc(p)} in ${esc(g)}">${svg}<line id="vCross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#F2F3F5" stroke-opacity=".35" visibility="hidden"/><rect x="${L}" y="0" width="${W - L - Rm}" height="${H - B}" fill="transparent" id="vHit"/></svg>`;
  const hit = $("#vHit"), cross = $("#vCross");
  const opDag = ev => {
    const r = hit.ownerSVGElement.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;
    let best = dagen[0]; dagen.forEach(d => { if(Math.abs(xs(d) - x) < Math.abs(xs(best) - x)) best = d; });
    const v = s[best], f = rol[best];
    cross.setAttribute("x1", xs(best)); cross.setAttribute("x2", xs(best)); cross.setAttribute("visibility", "visible");
    toonTip(`<span class="t-k">${datumKort(dates[best])} · ${g === ETAPPE ? "etappe" : esc(g)}</span>
      <b>${fmt(v.t)}</b>${v.straf ? ` <span style="color:var(--rood)">incl. straftijd</span>` : ""}<br>
      <span class="t-s">Gemiddelde renner: ${fmt(v.norm)}</span><br>
      <b>${Math.round(v.watt)} W</b> <span class="t-s">${v.watt >= BASIS ? pctTxt(1 - BASIS / v.watt) + " sneller" : pctTxt(BASIS / v.watt - 1) + " trager"} dan verwacht</span>
      ${f ? `<br><span class="t-s">Vorm toen: ${Math.round(f.watt)} W</span>` : ""}`, ev.clientX, ev.clientY);
  };
  hit.addEventListener("pointermove", opDag); hit.addEventListener("pointerdown", opDag);
  hit.addEventListener("pointerleave", () => { verbergTip(); cross.setAttribute("visibility", "hidden"); });

  /* conclusie: trend over de hele periode, als procent per maand */
  const xsN = dagen.map(d => num[d]), ys = dagen.map(d => s[d].r), mx = mean(xsN), my = mean(ys);
  const helling = xsN.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / xsN.reduce((a, x) => a + (x - mx) ** 2, 0);
  const pm = Math.exp(-helling * 30) - 1;
  const nu = vorm(p, g), t = vorigEind >= 0 ? vorm(p, g, vorigEind) : null;
  const naam = g === ETAPPE ? "over alle spellen" : `in ${esc(g)}`;
  let zin = Math.abs(pm) < .03 ? `${esc(p)} is ${naam} vrij stabiel over de hele periode.` : `${esc(p)} wordt ${naam} gemiddeld <b>${pctTxt(pm)} per maand ${pm > 0 ? "sterker" : "zwakker"}</b> ten opzichte van de puzzel.`;
  if(nu && t) zin += ` Nu ${Math.round(nu.watt)} W, twee weken geleden ${Math.round(t.watt)} W.`;
  if(dagen.length < 20) zin += " Met nog maar " + dagen.length + " dagen is dit een eerste indruk.";
  $("#vConc").innerHTML = zin;
}

function wdCel(rs){
  if(!rs.length) return `<td class="leeg">–</td>`;
  const w = watt(mean(rs)), t = Math.max(-1, Math.min(1, Math.log(w / BASIS) / .45));
  const kleur = t >= 0 ? "var(--blauw)" : "var(--oranje)";
  let pijl = "";
  if(rs.length >= 4){
    const h = rs.length >> 1, f = watt(mean(rs.slice(h))) / watt(mean(rs.slice(0, h))) - 1;
    pijl = Math.abs(f) < .05 ? `<span class="pijl t-s">=</span>` : f > 0 ? `<span class="pijl op">▲${pctTxt(f)}</span>` : `<span class="pijl neer">▼${pctTxt(f)}</span>`;
  }
  return { w, html:`<td style="background:color-mix(in srgb, ${kleur} ${Math.round(Math.abs(t) * 55)}%, var(--wit-2))"`, pijl, n:rs.length };
}
function renderWeek(){

      const tijden = ds.map(d => s[d].t), groep = [];
      ds.forEach(d => { if(g === ETAPPE) groep.push(...E[d].m.filter(q => E[d].full[q]).map(q => E[d].full[q])); else groep.push(...Object.values(raw[g][d])); });

    <div class="schaal"><span>zwakker</span><span class="balk"></span><span>sterker dan gemiddeld</span></div>
    <div class="scroll"><table class="tbl"><thead><tr><th></th>${DAGEN.map(d => `<th>${d}</th>`).join("")}</tr></thead>

  const beste = rijen.map(r => ({ g:r.g, f:median(r.nu) / median(r.begin) - 1, sp:(quant(r.nu, .75) / quant(r.nu, .25)) / (quant(r.begin, .75) / quant(r.begin, .25)) })).sort((a, b) => b.f - a.f);

    <p class="conclusie">Grootste sprong: <b>${esc(beste[0].g)}</b>, ${beste[0].f >= 0 ? pctTxt(beste[0].f) + " sterker" : "al ging het " + pctTxt(beste[0].f) + " achteruit"}. ${constant && constant.sp < .9 ? `In <b>${esc(constant.g)}</b> ben je het meest constant geworden.` : ""}</p>`;

function renderReeksen(){
  const p = speler, start = dIdx.get(eerste[p]), c = comb[p];
  const totaal = D - start, volledig = E.slice(start).filter(e => e.full[p] != null).length;

  let reeks = 0; for(let d = D - 1; d >= start && E[d].full[p] != null; d--) reeks++;
  let lang = 0, cur = 0, langEind = -1; for(let d = start; d < D; d++){ if(c[d] && c[d].watt > BASIS){ cur++; if(cur > lang){ lang = cur; langEind = d; } } else cur = 0; }
  let nuBoven = 0; for(let d = D - 1; d >= start && c[d] && c[d].watt > BASIS; d--) nuBoven++;
  const weken = {}; for(let d = start; d < D; d++) if(c[d]){ const dt = new Date(dates[d] + "T12:00:00"); dt.setDate(dt.getDate() - wd[d]); const k = dt.toISOString().slice(0, 10); (weken[k] ||= []).push(c[d].r); }
  const besteWeek = Object.entries(weken).filter(([, v]) => v.length >= 5).map(([k, v]) => ({ k, w:watt(mean(v)) })).sort((a, b) => b.w - a.w)[0];

function renderOpvallend(){
  const p = speler, c = comb[p], feiten = [];
  const dagen = c.map((v, d) => v && { ...v, d }).filter(Boolean);
  const best = dagen.slice().sort((a, b) => b.watt - a.watt)[0], slecht = dagen.slice().sort((a, b) => a.watt - b.watt)[0];
  if(best) feiten.push(["★", `Beste dag ooit: <b>${datumNL(dates[best.d])}</b>, ${Math.round(best.watt)} W over alle spellen (${fmt(best.t)}, verwacht ${fmt(best.norm)}).`]);
  if(slecht) feiten.push(["↓", `Zwaarste dag: ${datumNL(dates[slecht.d])}, ${Math.round(slecht.watt)} W${slecht.straf ? ", met straftijd" : ""}.`]);
  /* onderling op etappes */
  const h2h = players.filter(q => q !== p).map(q => { let w = 0, l = 0; E.forEach(e => { if(e.tot[p] != null && e.tot[q] != null){ if(e.tot[p] < e.tot[q]) w++; else if(e.tot[p] > e.tot[q]) l++; } }); return { q, w, l }; }).filter(x => x.w + x.l >= 5);
  if(h2h.length){
    const nemesis = h2h.slice().sort((a, b) => a.w / (a.w + a.l) - b.w / (b.w + b.l))[0], prooi = h2h.slice().sort((a, b) => b.w / (b.w + b.l) - a.w / (a.w + a.l))[0];
    feiten.push(["⚔", `Lastigste tegenstander: <b>${esc(nemesis.q)}</b>. Van de ${nemesis.w + nemesis.l} onderlinge etappes won je er ${nemesis.w}.`]);
    if(prooi.q !== nemesis.q) feiten.push(["♥", `Favoriete prooi: <b>${esc(prooi.q)}</b>, ${prooi.w} van de ${prooi.w + prooi.l} onderlinge etappes gewonnen.`]);
  }
  /* sterkste spel tegen de groep */
  const pg = games.map(g => ({ g, v:vorm(p, g, D - 1, 999) })).filter(x => x.v).sort((a, b) => b.v.watt - a.v.watt);
  if(pg.length > 1) feiten.push(["◆", `Specialisme: <b>${esc(pg[0].g)}</b> (${Math.round(pg[0].v.watt)} W over de hele periode). Werk aan de winkel: ${esc(pg[pg.length - 1].g)} (${Math.round(pg[pg.length - 1].v.watt)} W).`]);
  /* weekdag-PR's */
  const prs = []; games.forEach(g => DAGEN.forEach((_, w) => { let b = null; for(let d = 0; d < D; d++) if(wd[d] === w && raw[g][d] && raw[g][d][p] != null && (!b || raw[g][d][p] < b.t)) b = { t:raw[g][d][p], d }; if(b && num[D - 1] - num[b.d] < VENSTER) prs.push(`${g} op ${DAGEN_LANG[w]}`); }));
  if(prs.length) feiten.push(["⚡", `In de laatste 14 dagen ${prs.length} weekdagrecord${prs.length > 1 ? "s" : ""} gebroken: ${esc(namen(prs.slice(0, 4)))}${prs.length > 4 ? " en meer" : ""}.`]);
  /* snelste seconde */
  let snel = null; games.forEach(g => raw[g].forEach((v, d) => { if(v && v[p] != null && (!snel || v[p] < snel.t)) snel = { t:v[p], g, d }; }));
  if(snel) feiten.push(["⏱", `Snelste spel ooit: ${esc(snel.g)} in ${snel.t} seconde${snel.t === 1 ? "" : "n"}, op ${datumNL(dates[snel.d])}.`]);
  $("#s-opvallend").innerHTML = `<h2>Opvallend</h2>${feiten.map(([i, t]) => `<div class="feit"><span class="ic" aria-hidden="true">${i}</span><span>${t}</span></div>`).join("")}`;
}

/* ===== PELOTON ===== */
function renderPeloton(){
  const rij = players.map(q => ({ q, nu:vorm(q, ETAPPE), toen:vorigEind >= 0 ? vorm(q, ETAPPE, vorigEind) : null, lijn:glijdend(q, ETAPPE).map(x => x && x.watt) })).filter(x => x.nu).sort((a, b) => b.nu.watt - a.nu.watt);
  $("#p-vorm").innerHTML = `<h2>Vormranglijst</h2>
    <p class="toel">Wie trapt nu het hardst? Gemiddeld vermogen over de laatste 14 dagen, gemeten tegen de puzzels. Het lijntje is het verloop sinds de start.</p>
    ${rij.map((x, i) => `<div class="vorm-rij"><span class="pos">${i + 1}</span>${bib(x.q)}<span class="nm">${esc(x.q)}<small>${x.nu.n} dagen${x.nu.n < 5 ? ", te weinig voor een eerlijk beeld" : ""}</small></span>${spark(x.lijn, 110, 28, kleurVan(x.q))}<span class="w">${Math.round(x.nu.watt)} W<small>${deltaTxt(x.nu, x.toen)}</small></span></div>`).join("")}`;

  /* puzzelkalender */
  const g = kalSpel, diff = M[g].diff;

  { id:"compact", cat:"Kuriositeiten", naam:"Kleinste verschil tussen eerste en laatste", min:10, f:d => { const s = spread(E[d]); if(s == null) return null; const oud = E.slice(0, d).map(spread).filter(x => x != null); return oud.length && s < Math.min(...oud) ? `Het peloton bleef bij elkaar: maar ${fmt(s)} tussen de eerste en de laatste. Nog nooit zo klein.` : null; } },
  { id:"uiteen", cat:"Kuriositeiten", naam:"Grootste verschil tussen eerste en laatste", min:10, f:d => { const s = spread(E[d]); if(s == null) return null; const oud = E.slice(0, d).map(spread).filter(x => x != null); return oud.length && s > Math.max(...oud) ? `Het peloton spat uiteen: ${fmt(s)} tussen de eerste en de laatste. Nog nooit zo groot.` : null; } },
  { id:"basis", cat:"Altijd", naam:"Terugvaloptie: ritzege nummer zoveel", basis:true, f:d => { const e = E[d]; return e.winnaars.length ? `${e.winnaars.length > 1 ? `<b>${esc(namen(e.winnaars))}</b> delen de winst` : `<b>${esc(e.winnaars[0])}</b> pakt ritzege nummer ${ritWinsTot(e.winnaars[0], d)}`}, in ${fmt(e.rang[0].t)}.` : null; } }
];
/* alles één keer doorrekenen */
const AF = DET.map(det => dates.map((_, d) => d >= (det.min || 0) ? det.f(d) : null));
function weetjesVan(d){
  return DET.map((det, k) => {
    const tekst = AF[k][d]; if(!tekst) return null;
    const eerder = AF[k].slice(0, d).filter(Boolean).length;
    const score = det.basis ? -1 : Math.log((d + 1) / (eerder + 1));
    return { det, tekst, eerder, score, n:d + 1 };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
}
const zeldTxt = w => w.det.basis ? "Een gewone dag in de Tour" : w.eerder === 0 ? `Voor het eerst in ${w.n} etappes` : `Pas de ${w.eerder + 1}e keer in ${w.n} etappes`;
const zeldBalk = w => { const f = w.det.basis ? 0 : Math.min(1, w.score / Math.log(60)); const n = Math.max(1, Math.round(f * 8)); return `<span class="zeldmeter" aria-hidden="true" title="Zeldzaamheid">${[...Array(8)].map((_, i) => `<i class="${i < n ? "aan" : ""}" style="height:${6 + i * 1.6}px"></i>`).join("")}</span>`; };

function renderWeetje(){
  const d = wDag, e = E[d], lijst = weetjesVan(d), top = lijst[0], rest = lijst.slice(1, 4).filter(x => !x.det.basis);
  $("#w-dag").innerHTML = `<h2>Op de Tour-pagina</h2>
    <div class="wnav"><button id="wVor" aria-label="Vorige etappe" ${d === 0 ? "disabled" : ""}>&#8249;</button>
      <select id="wKies" aria-label="Kies etappe">${dates.map((ds, i) => `<option value="${i}" ${i === d ? "selected" : ""}>Etappe ${i + 1} · ${datumKort(ds)}</option>`).join("")}</select>
      <button id="wVol" aria-label="Volgende etappe" ${d === D - 1 ? "disabled" : ""}>&#8250;</button></div>
    <div class="weetje">
      <div class="w-band"><span class="w-label">Weetje van de dag</span><span class="w-cat">${esc(top.det.cat)}</span></div>
      <p class="w-tekst">${top.tekst}</p>
      <div class="w-zeld"><span class="pill ${top.eerder === 0 && !top.det.basis ? "vol" : ""}">${zeldTxt(top)}</span>${zeldBalk(top)}</div>
    </div>
    ${rest.length ? `<div class="ook"><h3>Ook vandaag</h3>${rest.map(w => `<div class="feit"><span class="ic" aria-hidden="true">◆</span><span>${w.tekst} <span class="t-s" style="color:var(--sub);font-size:13px">${zeldTxt(w)}.</span></span></div>`).join("")}</div>` : ""}
    <div class="huld"><div class="h-baan"></div><div class="h-in"><p class="h-k">Huldiging · laatste scène, na het podium</p><p>Wist je dat… ${top.tekst.replace(/<\/?b>/g, "")}</p></div></div>`;
  $("#wVor").onclick = () => { wDag--; renderWeetje(); };
  $("#wVol").onclick = () => { wDag++; renderWeetje(); };
  $("#wKies").onchange = ev => { wDag = +ev.target.value; renderWeetje(); };

  const tel = DET.map((det, k) => ({ det, n:AF[k].filter(Boolean).length, laatst:AF[k].map((x, i) => x ? i : -1).filter(i => i >= 0).pop(), top:dates.filter((_, i) => weetjesVan(i)[0].det === det).length }));
  const cats = [...new Set(DET.map(x => x.cat))];
  $("#w-cat").innerHTML = `<h2>Alle ${DET.length - 1} weetjes</h2>
    <p class="toel">Elke dag draaien al deze controles. Het weetje dat in het verleden het minst vaak voorkwam, wint. Records per weekdag tellen pas mee als die weekdag al 3 keer gereden is; "ooit"-records pas na 10 etappes, anders zou de eerste week vol records staan. "Weetje van de dag" telt hoe vaak het de hoofdrol kreeg.</p>
    <div class="scroll"><table class="cat-tbl"><thead><tr><th>Weetje</th><th style="text-align:right">Kwam voor</th><th style="text-align:right">Hoofdrol</th><th>Laatst</th></tr></thead><tbody>
    ${cats.map(c => `<tr><td colspan="4" class="groep">${esc(c)}</td></tr>` + tel.filter(t => t.det.cat === c).map(t => `<tr class="${t.n ? "" : "nooit"}"><td>${esc(t.det.naam)}</td><td class="n">${t.n ? t.n + "×" : "nog nooit"}</td><td class="n">${t.top || "–"}</td><td>${t.laatst != null ? `<a href="#weetje" data-d="${t.laatst}" style="color:var(--asfalt)">${datumKort(dates[t.laatst])}</a>` : ""}</td></tr>`).join("")).join("")}
    </tbody></table></div>`;
  $("#w-cat").querySelectorAll("a[data-d]").forEach(a => a.onclick = ev => { ev.preventDefault(); wDag = +a.dataset.d; renderWeetje(); $("#w-dag").scrollIntoView({ behavior:"smooth" }); });
}

/* ===== tabs en opstart ===== */
function toon(t){
  tab = t;
  document.querySelectorAll(".hoofdtabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  ["ik","peloton","weetje"].forEach(x => $("#v-" + x).hidden = x !== t);
  try{ history.replaceState(null, "", "#" + t); }catch(e){}
  ({ ik:renderIk, peloton:renderPeloton, weetje:renderWeetje })[t]();
}
document.querySelectorAll(".hoofdtabs button").forEach(b => b.onclick = () => toon(b.dataset.tab));
addEventListener("hashchange", () => { const h = location.hash.slice(1); if(["ik","peloton","weetje"].includes(h) && h !== tab) toon(h); });
$("#voet").innerHTML = `Vermogen is een spelletje met de data, geen echte watt: 300 W is wat een gemiddelde renner uit de groep op dezelfde puzzel zou doen. Hoe zwaar een puzzel was, schatten we uit de tijden van de anderen, dus je eigen tijd telt niet mee in je eigen maatstaf. Gemiste spellen tellen als straftijd. ${D} etappes, ${rijen.length} tijden.`;
let breedte = innerWidth;
addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(() => { if(innerWidth !== breedte){ breedte = innerWidth; toon(tab); } }, 200); });
toon(tab);
})();
</script>
