<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14161A">
<title>Tour de LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
<header class="omroep">
  <canvas id="peloton" aria-hidden="true"></canvas>
  <h1 class="merk">Tour de <em>LinkedIn</em></h1>
  <div class="ticker" id="ticker">
    <span class="live" id="liveLabel"><i></i><span>Live</span></span>
    <div class="baan"><div class="loop" id="tickerLoop" aria-hidden="true"></div></div>
  </div>
</header>
<div class="wrap">
  <div class="top">
    <div class="nav">
      <button id="vorige" aria-label="Vorige etappe">&#8249;</button>
      <select id="kies" aria-label="Kies etappe"></select>
      <button id="volgende" aria-label="Volgende etappe">&#8250;</button>
    </div>
  </div>

  <p id="status" class="status">Scores laden…</p>

  <div id="inhoud" hidden>
  <div class="tabs views" role="group" aria-label="Kies weergave">
    <button data-view="tour" aria-pressed="true">Tour</button>
    <button data-view="stats" aria-pressed="false">Statistieken</button>
    <button data-view="spelen" aria-pressed="false">Trainen</button>
    <button type="button" id="invoerKnop" class="invoer-knop" hidden>+ Scores invoeren</button>
  </div>

  <div id="tourView">
    <div class="hero" id="hero"></div>
    <div id="weetje"></div>
    <section id="uitslag"></section>
    <section id="tourSectie"></section>
    <section id="truien"></section>
    <section id="klassement"></section>
    <section id="erelijst"></section>
  </div>

  <div id="statView" hidden>
    <div class="tabs vm-sub" id="statSub" role="group" aria-label="Kies onderdeel">
      <button data-sub="ik" aria-pressed="true">Ik</button>
      <button data-sub="peloton" aria-pressed="false">Peloton</button>
    </div>
    <div id="statIk"></div>
    <div id="statPeloton" hidden>
    <section id="p-vorm"></section>
    <section id="p-kal"></section>
    <div class="tabs" id="statFilter" role="group" aria-label="Kies speler"></div>
    <section id="s-records"></section>
    <section id="s-weekdag"></section>
    <section id="s-spelers"></section>
    <section id="s-onderling"></section>
    <section id="s-verloop"></section>
    <section id="s-opvallend"></section>
    </div>
  </div>

  <div id="speelView" hidden></div>

  </div>

  <footer><span id="bijgewerkt" style="display:block;margin-bottom:6px"></span>Tijden in seconden, per etappe opgeteld over alle spellen. Laagste tijd wint. Elke kalendermaand is een nieuwe Tour, van de 1e tot en met de laatste dag. <span id="regel"></span></footer>
</div>

<dialog id="invoer" aria-labelledby="inTitel">
  <form id="invoerForm" novalidate>
    <div class="in-kop">
      <h2 id="inTitel">Scores invoeren</h2>
      <button type="button" id="inSluit" class="in-sluit" aria-label="Sluiten">&times;</button>
    </div>
    <div class="tabs in-modus" id="inModus" role="group" aria-label="Invoeren per">
      <button type="button" data-modus="spel" aria-pressed="true">Per spel</button>
      <button type="button" data-modus="speler" aria-pressed="false">Per speler</button>
    </div>
    <div class="in-rij">
      <label><span id="inKiesLabel">Spel</span><select id="inKies"></select></label>
      <label>Datum<input type="date" id="inDatum" required></label>
    </div>
    <p class="toel" id="inUitleg"></p>
    <div id="inTijden" class="in-tijden"></div>
    <label id="inCodeRij" class="in-code" hidden>Groepscode<input id="inCode" type="password" autocomplete="off"><small>Eenmalig; deze browser onthoudt hem daarna.</small></label>
    <p id="inMelding" class="in-melding" role="status" aria-live="polite"></p>
    <div class="in-knoppen">
      <button type="submit" id="inOpslaan" class="in-opslaan">Opslaan</button>
    </div>
  </form>
</dialog>

<script src="config.js?v=dev"></script>
<script src="fiets.js?v=dev"></script>
<script src="peloton.js?v=dev"></script>
<script src="huldiging.js?v=dev"></script>
<script src="statistiek.js?v=dev"></script>
<script src="kronen-logica.js?v=dev"></script>
<script src="kronen.js?v=dev"></script>
<script src="app.js?v=dev"></script>
<script src="invoer.js?v=dev"></script>
</body>
</html>
