<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tour de LinkedIn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 class="merk">Tour de LinkedIn</h1>
    <div class="nav">
      <button id="vorige" aria-label="Vorige etappe">&#8249;</button>
      <select id="kies" aria-label="Kies etappe"></select>
      <button id="volgende" aria-label="Volgende etappe">&#8250;</button>
    </div>
  </div>

  <p id="status" class="status">Scores laden…</p>

  <div id="inhoud" hidden>
  <div class="tabs views" role="group" aria-label="Kies weergave">
    <button data-view="tour" aria-pressed="true">Tour</button>
    <button data-view="stats" aria-pressed="false">Statistieken</button>
  </div>

  <div id="tourView">
    <div class="hero" id="hero"></div>
    <section id="uitslag"></section>
    <section id="truien"></section>
    <section id="klassement"></section>
    <section id="erelijst"></section>
  </div>

  <div id="statView" hidden>
    <div class="tabs" id="statFilter" role="group" aria-label="Kies speler"></div>
    <section id="s-records"></section>
    <section id="s-weekdag"></section>
    <section id="s-spelers"></section>
    <section id="s-onderling"></section>
    <section id="s-verloop"></section>
    <section id="s-opvallend"></section>
  </div>

  </div>

  <footer><span id="bijgewerkt" style="display:block;margin-bottom:6px"></span>Tijden in seconden, per etappe opgeteld over alle spellen. Laagste tijd wint. Elke maand is een nieuwe Tour, opgebouwd uit hele weken: een week hoort bij de maand waarin de donderdag valt. <span id="regel"></span></footer>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
